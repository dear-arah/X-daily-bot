# group: agora = Agora news and community posts, own = your own articles, world = tech and AI news for context.
# The bot never copies these; it uses them as material and as a weekly "what is happening" brief.
sources:
  # --- Agora ---
  # The dev.to and Medium tag feeds also carry unrelated posts ("agora" is a common word),
  # so must_match keeps only items that mention Agora's product names.
  - {name: "Agora on GitHub", url: "https://github.com/AgoraIO.atom", group: agora}
  - {name: "Agora Skills releases", url: "https://github.com/AgoraIO/skills/releases.atom", group: agora}
  - {name: "Agora Python Server SDK releases", url: "https://github.com/AgoraIO-Extensions/Agora-Python-Server-SDK/releases.atom", group: agora}
  - {name: "dev.to community posts about Agora", url: "https://dev.to/feed/tag/agora", group: agora, must_match: [agora.io, agoraio, "agora rtc", "agora rtm", "agora sdk", "agora conversational", "agora voice", "agora video", "agora ai", "agora skills", "agora cli", "agora console"]}
  - {name: "Medium community posts about Agora", url: "https://medium.com/feed/tag/agora", group: agora, must_match: [agora.io, agoraio, "agora rtc", "agora rtm", "agora sdk", "agora conversational", "agora voice", "agora video", "agora ai", "agora skills", "agora cli", "agora console"]}
  - {name: "agora.io (news search)", url: "https://news.google.com/rss/search?q=site:agora.io+when:14d&hl=en-US&gl=US&ceid=US:en", group: agora}

  # --- Your own articles ---
  - {name: "My dev.to articles", url: "https://dev.to/feed/dear-arah", group: own}
  - {name: "My Medium articles", url: "https://medium.com/feed/@dearahmbarsolasco", group: own}

  # --- Tech, AI and developer ecosystem ---
  - {name: "OpenAI News", url: "https://openai.com/news/rss.xml", group: world}
  - {name: "Google DeepMind", url: "https://deepmind.google/blog/rss.xml", group: world}
  - {name: "Google AI Blog", url: "https://blog.google/technology/ai/rss/", group: world}
  - {name: "Microsoft AI News", url: "https://news.microsoft.com/source/topics/ai/feed", group: world}
  - {name: "NVIDIA Developer Blog", url: "https://developer.nvidia.com/blog/feed", group: world}
  - {name: "Hugging Face Blog", url: "https://huggingface.co/blog/feed.xml", group: world}
  - {name: "GitHub Blog", url: "https://github.blog/feed/", group: world}
  - {name: "ElevenLabs Blog", url: "https://elevenlabs.io/blog/rss.xml", group: world}
  - {name: "LiveKit Agents releases", url: "https://github.com/livekit/agents/releases.atom", group: world}
  - {name: "Simon Willison", url: "https://simonwillison.net/atom/everything/", group: world}
  - {name: "Latent Space", url: "https://www.latent.space/feed", group: world}
  - {name: "TechCrunch AI", url: "https://techcrunch.com/category/artificial-intelligence/feed/", group: world}
  - {name: "The Verge AI", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", group: world}
  - {name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", group: world}
  - {name: "Hacker News (200+ points)", url: "https://hnrss.org/frontpage?points=200", group: world}
