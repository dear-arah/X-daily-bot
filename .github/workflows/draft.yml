name: draft

on:
  schedule:
    - cron: "27 0 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Draft again even if today already has a draft"
        type: boolean
        default: false

concurrency:
  group: draft
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Load state
        id: load
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: sh scripts/load-state.sh "$STATE_REMOTE" state-repo

      - name: Fetch the Agora knowledge pack
        run: sh scripts/sync-agora-skills.sh knowledge/agora-skills

      - name: Draft today's post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m xpost run --state state-repo/state.json --force
          else
            python -m xpost run --state state-repo/state.json
          fi

      - name: Save state
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        env:
          STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: sh scripts/save-state.sh "$STATE_REMOTE" state-repo
